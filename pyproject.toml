[project]
name = "portico"
version = "0.1.0"
description = "Portico — MCP Gateway Integration Hub"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.111.0,<1.0",
    "uvicorn[standard]>=0.29.0,<1.0",
    "pydantic>=2.7.0,<3.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0,<1.0",
    "fastmcp>=3.2.0,<4.0",
    "asyncpg>=0.29.0,<1.0",
    "cryptography>=42.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py314"
line-length = 220
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["portico"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F841"]


